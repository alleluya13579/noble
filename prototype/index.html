<style>
/* Layout: sticky account bar, tabbed workspace; browse = survey map beside listing ledger, stacking on phones */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --sunk: #e8ece7;
  --line: #d3dad2;
  --ink: #17221d;
  --muted: #5b6a62;
  --accent: #0e6a57;
  --accent-ink: #ffffff;
  --accent-soft: #d9ece5;
  --escrow: #a8711a;
  --escrow-soft: #f5e8cf;
  --ok: #2f7d3b;
  --ok-soft: #dcefdc;
  --warn: #9a5b00;
  --warn-soft: #fbe9c9;
  --bad: #b3322a;
  --bad-soft: #f8dcd8;
  --map-land: #e3e9dd;
  --map-water: #bcd6dc;
  --map-road: #ffffff;
  --sale: #0e6a57;
  --rent: #2b5ea8;
  --rent-soft: #dde7f5;
  --land: #a8711a;
  --star: #d9a21b;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #19221d; --sunk: #0d130f; --line: #2d3a33; --ink: #e6ede8; --muted: #9aaba2;
    --accent: #3fb898; --accent-ink: #06261e; --accent-soft: #173b31; --escrow: #e0a84a; --escrow-soft: #3a2c13;
    --ok: #6cc77a; --ok-soft: #183622; --warn: #e5a54a; --warn-soft: #3a2a10; --bad: #f07a70; --bad-soft: #3d1a17;
    --map-land: #1d2a23; --map-water: #1c3a44; --map-road: #2c3b33; --sale: #3fb898; --rent: #6f9be0; --rent-soft: #1b2b44; --land: #e0a84a; --star: #f0c045;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #19221d; --sunk: #0d130f; --line: #2d3a33; --ink: #e6ede8; --muted: #9aaba2;
  --accent: #3fb898; --accent-ink: #06261e; --accent-soft: #173b31; --escrow: #e0a84a; --escrow-soft: #3a2c13;
  --ok: #6cc77a; --ok-soft: #183622; --warn: #e5a54a; --warn-soft: #3a2a10; --bad: #f07a70; --bad-soft: #3d1a17;
  --map-land: #1d2a23; --map-water: #1c3a44; --map-road: #2c3b33; --sale: #3fb898; --rent: #6f9be0; --rent-soft: #1b2b44; --land: #e0a84a; --star: #f0c045;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.6rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.star { color: var(--star); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand b { font-family: var(--f-display); font-size: 1.35rem; letter-spacing: -.01em; }
.brand span { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.who select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 100%; }
.bell { position: relative; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.bell i { position: absolute; top: -6px; right: -6px; background: var(--bad); color: #fff; font-style: normal; font-size: .7rem; border-radius: 99px; padding: 0 6px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 0; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); white-space: nowrap; font-weight: 500; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .ct { font-family: var(--f-mono); font-size: .75rem; background: var(--sunk); border-radius: 99px; padding: 1px 7px; margin-left: 4px; }

main { padding-block: 24px 64px; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }

/* Pills & buttons */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.escrow { background: var(--escrow-soft); color: var(--escrow); }
.pill.info { background: var(--rent-soft); color: var(--rent); }
.pill.t-sale { background: var(--accent-soft); color: var(--sale); }
.pill.t-rent { background: var(--rent-soft); color: var(--rent); }
.pill.t-land { background: var(--escrow-soft); color: var(--land); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .9rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.escrow { background: var(--escrow); color: var(--surface); border-color: var(--escrow); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.heart { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--muted); font-size: 1rem; line-height: 1; flex: none; }
.heart[aria-pressed="true"] { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }

/* Browse */
.search { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.search input, .search select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.browse { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.mapbox { position: sticky; top: 130px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.map { width: 100%; height: auto; display: block; border-radius: 6px; background: var(--map-land); }
.map .pin { cursor: pointer; }
.map text { font-family: var(--f-mono); fill: var(--muted); }
.legend { display: flex; gap: 14px; margin-top: 8px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: currentColor; vertical-align: 0; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ledger { display: grid; gap: 10px; }
.lcard { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; cursor: pointer; text-align: left; width: 100%; }
.lcard:hover, .lcard.hl { border-color: var(--accent); }
.lcard .ph { aspect-ratio: 4/3; border-radius: 6px; overflow: hidden; max-width: 100%; }
.lcard .ph svg, .gallery svg, .thumbs svg, .pickgrid svg { display: block; width: 100%; height: 100%; }
.lmeta { display: grid; gap: 4px; min-width: 0; }
.price { font-family: var(--f-mono); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.price small { color: var(--muted); font-size: .78rem; }
.facts { display: flex; gap: 12px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.stack { display: grid; gap: 14px; }
.detail { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.gallery { aspect-ratio: 16/9; border-radius: var(--r); overflow: hidden; max-width: 100%; }
.thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
.thumbs button { padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; aspect-ratio: 4/3; cursor: pointer; background: none; }
.thumbs button[aria-current="true"] { border-color: var(--accent); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: .85rem; }
dl.kv dd { margin: 0; }
.owner { display: flex; gap: 12px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-family: var(--f-display); flex: none; }
.field { display: grid; gap: 5px; }
.field > span { font-size: .85rem; font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.field .hint { font-size: .78rem; color: var(--muted); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.notice { border-radius: 8px; padding: 10px 12px; font-size: .88rem; background: var(--sunk); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.escrow { background: var(--escrow-soft); color: var(--escrow); }
.pickgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pickgrid button { padding: 0; aspect-ratio: 4/3; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; background: none; }
.pickgrid button[aria-pressed="true"] { border-color: var(--accent); }
.pickgrid button[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 2px; right: 4px; color: #fff; font-weight: 700; text-shadow: 0 0 3px #000; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.stats b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: .75rem; color: var(--muted); }

/* Messages */
.chat { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; min-height: 460px; }
.threads { display: grid; gap: 6px; align-content: start; }
.thread { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; cursor: pointer; width: 100%; }
.thread[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.convo { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.convo header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.msgs { padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 440px; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; background: var(--sunk); overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent-soft); }
.msg .t { font-size: .72rem; color: var(--muted); margin-top: 2px; }
.offer { border: 1px dashed var(--escrow); background: var(--escrow-soft); color: var(--ink); }
.viewing { border: 1px dashed var(--rent); background: var(--rent-soft); color: var(--ink); }
.sys { align-self: center; font-size: .78rem; color: var(--muted); text-align: center; }
.composer { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
.composer form { display: flex; gap: 8px; flex-wrap: wrap; }
.composer input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }

/* Escrow */
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 6px 0 4px; list-style: none; padding: 0; }
.steps li { position: relative; padding-top: 22px; font-size: .78rem; color: var(--muted); text-align: center; padding-inline: 4px; }
.steps li::before { content: ""; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); z-index: 1; }
.steps li::after { content: ""; position: absolute; top: 10px; left: -50%; width: 100%; height: 2px; background: var(--line); }
.steps li:first-child::after { display: none; }
.steps li.done { color: var(--ink); }
.steps li.done::before { background: var(--escrow); border-color: var(--escrow); }
.steps li.done::after { background: var(--escrow); }
.steps li.fail::before { background: var(--bad); border-color: var(--bad); }
.split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.split div { background: var(--sunk); border-radius: 8px; padding: 10px; min-width: 0; }
.split b { display: block; font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.confirms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.confirm { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .88rem; }
.confirm .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.confirm.on .dot { background: var(--ok); }
.log { margin: 0; padding-left: 18px; font-size: .82rem; color: var(--muted); display: grid; gap: 2px; }
.stars button { background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: var(--line); padding: 0 2px; }
.stars button:hover, .stars button:hover ~ button { color: var(--line); }
.stars:hover button { color: var(--star); }
.stars button:hover ~ button { color: var(--line); }
.record { background: var(--sunk); border-radius: 8px; padding: 12px; font-family: var(--f-mono); font-size: .8rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; }

/* Admin */
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.qcard { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.checks { display: grid; gap: 4px; font-size: .86rem; margin: 0; padding: 0; }
.checks li { list-style: none; display: flex; gap: 8px; }
.chk { display: grid; gap: 6px; font-size: .86rem; background: var(--sunk); border-radius: 8px; padding: 10px; }
.chk label { display: flex; gap: 8px; align-items: start; cursor: pointer; }
.chk input { margin-top: 3px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
td.c, th.c { text-align: center; }
.yes { color: var(--ok); font-weight: 700; }
.no { color: var(--muted); }

/* Blueprint */
.bp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.bp ul, .bp ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.bp .wide { grid-column: 1 / -1; }

/* Modal & toast */
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; width: min(520px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px; display: grid; gap: 14px; }
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); display: grid; gap: 8px; z-index: 60; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: .88rem; box-shadow: 0 6px 20px rgba(0,0,0,.18); animation: rise .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.drawer { position: absolute; right: 0; top: 100%; width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(0,0,0,.15); padding: 10px; display: grid; gap: 6px; z-index: 30; }
.drawer div { font-size: .85rem; padding: 6px 8px; border-radius: 6px; background: var(--sunk); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

@media (max-width: 900px) {
  .browse, .detail, .chat, .bp { grid-template-columns: minmax(0, 1fr); }
  .mapbox { position: static; }
  .qcard { grid-template-columns: minmax(0, 1fr); }
  .qcard .ph { max-width: 220px; }
  .search { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .search .q { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .lcard { grid-template-columns: 96px minmax(0, 1fr); }
  .grid2, .confirms { grid-template-columns: minmax(0, 1fr); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pickgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .steps li { font-size: .68rem; }
  .brand span { display: none; }
}
</style>

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, c) => { try { return new Intl.NumberFormat(C().locale, { style: 'currency', currency: c, maximumFractionDigits: 0 }).format(Math.round(n)); } catch (e) { return `${c} ${Math.round(n).toLocaleString('en-US')}`; } };
const me = () => S.users[S.me];
const user = id => S.users[id] || { id, name: 'Former member', role: 'buyer', verified: true };
const listing = id => S.listings.find(l => l.id === id);
const initials = n => n.split(' ').map(p => p[0]).slice(0, 2).join('');
const ago = t => { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + 'm ago'; const h = Math.round(m / 60); return h < 48 ? h + 'h ago' : Math.round(h / 24) + 'd ago'; };
const fmtDate = t => new Date(t).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtWhen = t => new Date(t).toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtTs = t => new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const typeLabel = { get sale() { return T('For sale'); }, get rent() { return T('For rent'); }, get land() { return T('Land'); } };
const closedLabel = l => T(l.type === 'rent' ? 'Let' : 'Sold');
function toast(text, bad) { const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = text; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3800); }
function notify(uid, text) { (S.notes[uid] = S.notes[uid] || []).unshift({ t: Date.now(), text }); }
function audit(action, target, by) { S.audit.unshift([Date.now(), by || me().name, action, target]); }
function depositFor(l, price) { const p = (COUNTRIES[l.country] || C()).policy; return l.type === 'rent' ? price * (1 + p.rentDepositMonths) : Math.round(price * p.depositPct); }
const depositLabel = l => l.type === 'rent' ? `First month + ${P().rentDepositMonths} month deposit` : `${P().depositPct * 100}% deposit`;
function agreedPrice(l, buyerId) {
  const th = S.threads.find(t => t.listingId === l.id && t.a === buyerId);
  const acc = th && [...th.messages].reverse().find(m => m.offer && m.offer.status === 'accepted');
  return acc ? acc.offer.amount : l.price;
}
function ratingOf(uid) { const r = S.ratings.filter(x => x.to === uid); return { n: r.length, avg: r.length ? r.reduce((a, x) => a + x.stars, 0) / r.length : 0 }; }
function dealsOf(uid) { return (user(uid).deals || 0) + S.txns.filter(t => t.status === 'released' && (t.buyer === uid || t.seller === uid) && t.releasedAt > now - 1000).length; }
function trustLine(u) { const r = ratingOf(u.id); return `${r.n ? `<span class="star">★</span> ${r.avg.toFixed(1)} <span class="muted">(${r.n})</span> · ` : ''}${dealsOf(u.id)} deal${dealsOf(u.id) === 1 ? '' : 's'} completed · member since ${u.since || 2026}`; }
function isSaved(id) { return (S.saved[S.me] || []).includes(id); }
function listingStats(l) {
  const ths = S.threads.filter(t => t.listingId === l.id);
  return { views: l.views || 0, saves: Object.values(S.saved).filter(a => a.includes(l.id)).length, enquiries: ths.length, offers: ths.reduce((n, t) => n + t.messages.filter(m => m.offer).length, 0) };
}
function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = o, 1500); } };
  try { navigator.clipboard.writeText(text).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy is not available here. Select the text and copy it yourself.', true); } ta.remove(); }
}

/* Generated photos: each id is a stable illustration, so duplicate detection can compare ids like a perceptual hash would */
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function photo(id) {
  const h = hash(id), k = id[0];
  const sky = ['#9cc3d6', '#e8c9a0', '#b9cfe0', '#d7b9c9', '#a9d1c4'][h % 5];
  const ground = k === 'l' ? ['#8aa35c', '#a59253', '#7c9a4f'][h % 3] : '#7d9467';
  const wall = ['#efe6d6', '#d9cbb5', '#c9d3d6', '#e7d2c0', '#f2efe8'][(h >> 3) % 5];
  const roof = ['#7a3e2e', '#3f4a52', '#5d4a3a', '#8b5a2b'][(h >> 5) % 4];
  let body = '';
  if (k === 'h') {
    const w = 60 + (h >> 7) % 30, x = 80 - w / 2;
    body = `<rect x="${x}" y="48" width="${w}" height="34" fill="${wall}"/><polygon points="${x - 6},50 80,${26 + (h >> 9) % 8} ${x + w + 6},50" fill="${roof}"/><rect x="${x + 8}" y="56" width="12" height="10" fill="#4d6b7a"/><rect x="${x + w - 20}" y="56" width="12" height="10" fill="#4d6b7a"/><rect x="76" y="62" width="10" height="20" fill="${roof}"/><circle cx="${x - 14}" cy="66" r="10" fill="#4f7a43"/>`;
  } else if (k === 'a') {
    const fl = 3 + (h >> 7) % 4, top = 82 - fl * 12;
    body = `<rect x="52" y="${top}" width="56" height="${fl * 12}" fill="${wall}"/>`;
    for (let i = 0; i < fl; i++) for (let j = 0; j < 4; j++) body += `<rect x="${57 + j * 13}" y="${top + 3 + i * 12}" width="8" height="7" fill="${(i + j + h) % 3 ? '#4d6b7a' : '#f5d58a'}"/>`;
    body += `<rect x="30" y="60" width="18" height="22" fill="${roof}" opacity=".5"/><rect x="114" y="54" width="20" height="28" fill="${roof}" opacity=".4"/>`;
  } else {
    body = `<path d="M0 64 Q40 ${54 + h % 8} 80 62 T160 58 V100 H0Z" fill="${ground}" opacity=".85"/><line x1="20" y1="72" x2="140" y2="70" stroke="#f3ead0" stroke-dasharray="4 3"/><rect x="${24 + h % 90}" y="62" width="2" height="14" fill="#5d4a3a"/><circle cx="${120 - h % 40}" cy="56" r="9" fill="#4f7a43"/><circle cx="${40 + h % 30}" cy="58" r="6" fill="#4f7a43"/>`;
  }
  return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Listing photo ${esc(id)}"><rect width="160" height="100" fill="${sky}"/><circle cx="${130 - h % 90}" cy="20" r="8" fill="#fff3c4" opacity=".8"/><rect y="78" width="160" height="22" fill="${ground}"/>${body}</svg>`;
}
const PHOTO_LIB = ['h1','h2','h3','h4','h5','h6','h7','h8','a1','a2','a3','a4','a5','a6','a7','l1','l2','l3','l4','l5','l6','l7'];
function duplicatesOf(photos, exceptId) {
  const hits = [];
  for (const l of S.listings) if (l.id !== exceptId && l.status !== 'rejected') for (const p of photos) if (l.photos.includes(p)) hits.push({ p, l });
  return hits;
}

/* ---------- Gates ---------- */
function gate() {
  const u = me();
  if (u.suspended) { toast('This account is suspended. Contact support to appeal.', true); return false; }
  if (u.role === 'admin') return true;
  if (!u.verified) { openVerify(); return false; }
  return true;
}

/* ---------- Map ---------- */
function mapSVG(opts = {}) {
  const pins = (opts.listings || []).map(l => {
    const sel = S.selected === l.id;
    return `<g class="pin" data-act="select" data-id="${l.id}" tabindex="0" role="button" aria-label="${esc(l.title)}, ${esc(l.place)}">
      <circle cx="${l.x}" cy="${l.y}" r="${sel ? 3.2 : 2.3}" fill="var(--${l.type})" stroke="var(--surface)" stroke-width=".8"/>
      ${sel ? `<circle cx="${l.x}" cy="${l.y}" r="5" fill="none" stroke="var(--${l.type})" stroke-width=".5"/>` : ''}</g>`;
  }).join('');
  const draft = opts.draft ? `<g><circle cx="${opts.draft.x}" cy="${opts.draft.y}" r="2.6" fill="var(--accent)" stroke="var(--surface)" stroke-width=".8"/><circle cx="${opts.draft.x}" cy="${opts.draft.y}" r="5" fill="none" stroke="var(--accent)" stroke-width=".4" stroke-dasharray="1 1"/></g>` : '';
  return `<svg class="map" viewBox="0 0 100 66" ${opts.pick ? 'data-act="pick" style="cursor:crosshair"' : ''} aria-label="Map of ${C().city}">
    <rect width="100" height="66" fill="var(--map-land)"/>

    <path d="M47 0 C49 18 53 26 52 34 S58 50 62 66" stroke="var(--map-road)" stroke-width="1.4" fill="none"/>
    <path d="M0 30 C20 31 40 36 52 34 S80 28 100 22" stroke="var(--map-road)" stroke-width="1.4" fill="none"/>
    <path d="M52 34 L80 46 L92 66" stroke="var(--map-road)" stroke-width="1" fill="none"/>
    <path d="M52 34 L70 18 L100 6" stroke="var(--map-road)" stroke-width="1" fill="none"/>
    <path d="M10 66 C14 56 22 46 36 40" stroke="var(--map-road)" stroke-width=".8" fill="none"/>
    ${C().places.map(p => `<text x="${p.x}" y="${p.y + 5.5}" font-size="2.4" text-anchor="middle">${p.name}</text>`).join('')}
    <text x="97" y="63" font-size="2.2" text-anchor="end">N ↑  ·  1 unit ≈ 0.6 km</text>
    ${pins}${draft}</svg>`;
}
function nearestPlace(x, y) { return C().places.reduce((b, p) => (Math.hypot(p.x - x, p.y - y) < Math.hypot(b.x - x, b.y - y) ? p : b)).name; }

function myTxns() { const u = me(); return u.role === 'admin' ? S.txns : S.txns.filter(t => t.buyer === u.id || t.seller === u.id); }

/* ---------- Browse ---------- */
function searchResults() {
  const q = S.q, text = q.text.trim().toLowerCase();
  let out = S.listings.filter(l => l.status === 'approved' && l.country === S.country);
  if (S.filter !== 'all') out = out.filter(l => l.type === S.filter);
  if (q.saved) out = out.filter(l => isSaved(l.id));
  if (text) out = out.filter(l => (l.title + ' ' + l.place + ' ' + l.titleStatus).toLowerCase().includes(text));
  if (q.place !== 'all') out = out.filter(l => l.place === q.place);
  if (q.min !== '' && +q.min > 0) out = out.filter(l => l.price >= +q.min);
  if (q.max !== '' && +q.max > 0) out = out.filter(l => l.price <= +q.max);
  if (+q.beds > 0) out = out.filter(l => l.beds >= +q.beds);
  const sorters = { newest: (a, b) => b.created - a.created, 'price-asc': (a, b) => a.price - b.price, 'price-desc': (a, b) => b.price - a.price, popular: (a, b) => (b.views || 0) - (a.views || 0) };
  return out.sort(sorters[q.sort] || sorters.newest);
}

    <select id="q-place" aria-label="Area"><option value="all">${T('All areas')}</option>${c.places.map(p => `<option ${q.place === p.name ? 'selected' : ''}>${p.name}</option>`).join('')}</select>
    <input id="q-min" type="number" min="0" step="1000" placeholder="Min ${c.currency}" value="${esc(q.min)}" aria-label="Minimum price">
    <input id="q-max" type="number" min="0" step="1000" placeholder="Max ${c.currency}" value="${esc(q.max)}" aria-label="Maximum price">

function ownerActions(l) {

function statusPill(l) { return { approved: `<span class="pill ok">${T('Live')}</span>`, pending: `<span class="pill warn">${T('Pending review')}</span>`, rejected: `<span class="pill bad">${T('Rejected')}</span>`, removed: `<span class="pill bad">${T('Taken down')}</span>`, paused: `<span class="pill">${T('Paused')}</span>`, closed: `<span class="pill info">${closedLabel(l)}</span>` }[l.status]; }

/* ---------- Messages ---------- */

    if (m.offer) {
      const canAnswer = !mineMsg && m.offer.status === 'pending';
      return `<div class="msg offer ${mineMsg ? 'me' : ''}"><div class="label">Offer${l.type === 'rent' ? ' / month' : ''}</div><div class="price">${money(m.offer.amount, l.currency)}</div>
        <div class="row small">${{ pending: '<span class="pill warn">Awaiting reply</span>', accepted: '<span class="pill ok">Accepted</span>', declined: '<span class="pill">Declined</span>' }[m.offer.status]}

    if (m.viewing) {
      const canAnswer = !mineMsg && m.viewing.status === 'pending';

        <div class="row small">${{ pending: '<span class="pill warn">Awaiting reply</span>', accepted: `<span class="pill ok">Agreed${past ? ' · happened?' : ''}</span>`, declined: '<span class="pill">Declined</span>' }[m.viewing.status]}
        ${canAnswer ? `<button class="btn small" data-act="viewans" data-i="${i}" data-ans="accepted">${T('Accept')}</button><button class="btn ghost small" data-act="viewans" data-i="${i}" data-ans="declined">${T('Decline')}</button>` : ''}

/* ---------- Escrow ---------- */
function vEscrow() {
  const u = me(), list = myTxns();
  return `<div class="page-head"><div><h2>${T('Escrow')}</h2><p class="muted">Money is held by Noble until both sides confirm the viewing and the handover. Commission in ${C().name} is ${P().commission * 100}% on release. Unconfirmed deals refund automatically after ${P().viewingDays} days (viewing) or ${P().handoverDays} days (handover).</p></div></div>
  <div class="stack">${list.map(t => txnCard(t, u)).join('') || '<div class="empty">No escrow payments yet. Open a listing and choose “Pay into escrow”.</div>'}</div>`;
}
function txnCard(t, u) {
  const l = listing(t.listingId), b = user(t.buyer), s = user(t.seller);
  const isB = u.id === t.buyer, isS = u.id === t.seller;
  const pol = polOf(t), fee = t.amount * pol.commission;
  const v = t.viewing.buyer && t.viewing.seller, h = t.handover.buyer && t.handover.seller;
  const steps = [[T('Paid into escrow'), true], [T('Seller notified'), true], [T('Viewing confirmed'), v], [T('Handover confirmed'), h],
    [t.status === 'refunded' ? T('Refunded to buyer') : T('Released to seller'), t.status === 'released' || t.status === 'refunded']];
  const pill = { held: `<span class="pill escrow">${T('Held in escrow')}</span>`, disputed: `<span class="pill warn">${T('Refund requested')}</span>`, released: `<span class="pill ok">${T('Released')}</span>`, refunded: `<span class="pill bad">${T('Refunded')}</span>` }[t.status];
  const conf = (stage, side, who) => {
    const on = t[stage][side], can = t.status === 'held' && !on && ((side === 'buyer' && isB) || (side === 'seller' && isS)) && (stage === 'viewing' || v);
    return `<div class="confirm ${on ? 'on' : ''}"><span class="dot"></span><span style="flex:1">${who} ${stage === 'viewing' ? T('confirms viewing') : T('confirms handover')}</span>${can ? `<button class="btn small" data-act="confirm" data-id="${t.id}" data-stage="${stage}" data-side="${side}">${T('Confirm')}</button>` : on ? `<span class="small yes">${T('done')}</span>` : ''}</div>`;
  };
  let deadline = '';
  if (t.status === 'held') deadline = v ? `Auto-refund to ${esc(b.name.split(' ')[0])} on <b>${fmtDate(t.viewingAt + pol.handoverDays * D)}</b> unless both sides confirm the handover.` : `Auto-refund to ${esc(b.name.split(' ')[0])} on <b>${fmtDate(t.paidAt + pol.viewingDays * D)}</b> unless both sides confirm the viewing.`;
  let acts = '';
  if (t.status === 'held' && (isB || isS)) acts += `<button class="btn ghost danger" data-act="refundreq" data-id="${t.id}">${isB ? 'Deal fell through · request refund' : 'Cancel deal · refund buyer'}</button>`;
  if (t.status === 'disputed' && isS && t.disputeBy === 'buyer') acts += `<button class="btn" data-act="resolve" data-id="${t.id}" data-out="refunded">Agree to refund</button>`;
  if (t.status === 'disputed' && u.role === 'admin') acts += `<button class="btn" data-act="resolve" data-id="${t.id}" data-out="refunded">Refund buyer</button><button class="btn escrow" data-act="resolve" data-id="${t.id}" data-out="released">Release to seller</button>`;
  if (t.status === 'released') acts += `<button class="btn" data-act="record" data-id="${t.id}">${T('View deal record')}</button>`;
  let rating = '';
  if (t.status === 'released' && (isB || isS)) {
    const other = isB ? s : b, mine = S.ratings.find(r => r.txnId === t.id && r.from === u.id);
    rating = mine ? `<div class="small">You rated ${esc(other.name)} <span class="star">${'★'.repeat(mine.stars)}</span><span class="muted">${'★'.repeat(5 - mine.stars)}</span></div>`
      : `<div class="row small"><span>Rate ${esc(other.name.split(' ')[0])}:</span><span class="stars">${[1, 2, 3, 4, 5].map(n => `<button data-act="rate" data-id="${t.id}" data-stars="${n}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}</span></div>`;
  }
  return `<article class="panel stack">
    <div class="row" style="justify-content:space-between"><div><span class="mono small muted">${t.id}</span><h3>${esc(l.title)}</h3><div class="small muted">${esc(b.name)} → ${esc(s.name)} · ${t.method} · ${t.kind === 'rent' ? 'rent + deposit' : '10% deposit'} · paid ${fmtDate(t.paidAt)}</div></div>${pill}</div>
    <ol class="steps">${steps.map(([n, d], i) => `<li class="${d ? (i === 4 && t.status === 'refunded' ? 'done fail' : 'done') : ''}">${n}</li>`).join('')}</ol>
    <div class="split"><div><span class="label">${T('Held')}</span><b>${money(t.amount, t.currency)}</b></div><div><span class="label">${T('Noble commission')} ${pol.commission * 100}%</span><b>${money(fee, t.currency)}</b></div><div><span class="label">${T('Seller receives')}</span><b>${money(t.amount - fee, t.currency)}</b></div></div>
    ${deadline ? `<div class="notice small">${deadline}</div>` : ''}
    ${t.status === 'held' || t.status === 'disputed' ? `<div class="confirms">${conf('viewing', 'buyer', esc(b.name.split(' ')[0]))}${conf('viewing', 'seller', esc(s.name.split(' ')[0]))}${conf('handover', 'buyer', esc(b.name.split(' ')[0]))}${conf('handover', 'seller', esc(s.name.split(' ')[0]))}</div>` : ''}
    ${t.status === 'released' && l.type !== 'rent' ? `<div class="notice escrow small">Agreement <span class="mono">${t.agreement}</span> recorded. Legal transfer of title completes offline at the Lands Registry; the balance is paid through the buyer's advocate.</div>` : ''}
    ${rating}
    ${acts ? `<div class="row">${acts}</div>` : ''}
    <details><summary class="small muted" style="cursor:pointer">${T('Activity log')} (${t.log.length})</summary><ol class="log">${t.log.map(([ts, x]) => `<li><span class="mono">${fmtTs(ts)}</span> · ${esc(x)}</li>`).join('')}</ol></details>
  </article>`;
}
function dealRecord(t) {
  const l = listing(t.listingId), b = user(t.buyer), s = user(t.seller), pol = polOf(t), fee = t.amount * pol.commission, cc = COUNTRIES[l.country] || C();
  const lines = [
    `NOBLE DEAL RECORD ${t.agreement || ''}`.trim(),
    `Escrow reference   ${t.id}`,
    `Type               ${l.type === 'rent' ? 'Tenancy' : l.type === 'land' ? 'Land sale (deposit)' : 'House sale (deposit)'}`,
    `Property           ${l.title}, ${l.place}, Nairobi`,
    `Listing ref        ${l.id.toUpperCase()}-${hash(l.id) % 9000 + 1000}`,
    `Title status       ${l.titleStatus}`,
    `${l.type === 'rent' ? 'Tenant ' : 'Buyer  '}            ${b.name} (ID ${b.idNo || 'verified'})`,
    `${l.type === 'rent' ? 'Landlord' : 'Seller '}           ${s.name} (ID ${s.idNo || 'verified'})${l.clientOwner ? ` for ${l.clientOwner}` : ''}`,
    `Agreed price       ${money(t.price || l.price, t.currency)}${l.type === 'rent' ? ' per month' : ''}`,
    `Held in escrow     ${money(t.amount, t.currency)} via ${t.method}, ${fmtTs(t.paidAt)}`,
    `Viewing confirmed  ${t.viewingAt ? fmtTs(t.viewingAt) : '—'}`,
    `Handover confirmed ${t.releasedAt ? fmtTs(t.releasedAt) : '—'}`,
    `Commission         ${money(fee, t.currency)} (${pol.commission * 100}%)`,
    `Released to seller ${money(t.amount - fee, t.currency)}`,
    `Jurisdiction       ${cc.name}`,
    l.type !== 'rent' ? `Note               Balance and legal transfer of title are completed offline at ${cc.registry}.` : `Note               Deposit is held by the landlord under the tenancy terms agreed in chat.`
  ];
  return lines.join('\n');
}

  if (S.adminTab === 'audit') body = `<div class="panel tbl-wrap"><table><thead><tr><th>When</th><th>By</th><th>Action</th><th>Target</th></tr></thead><tbody>${S.audit.map(([t, by, a, tg]) => `<tr><td class="mono small">${fmtTs(t)}</td><td>${esc(by)}</td><td>${esc(a)}</td><td>${esc(tg)}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="page-head"><div><h2>${T('Moderation')}</h2><p class="muted">Nothing goes live, and no disputed money moves, without an admin decision. Every decision is logged. The queue covers every country; the document checklist names the registry for each listing's country.</p></div></div>

}

/* ---------- Blueprint ---------- */
function vBlueprint() {
  return `<div class="page-head"><div><h2>Blueprint</h2><p class="muted">What this prototype demonstrates, and what the production build needs.</p></div></div>
  <div class="bp">
    <section class="panel stack"><h3>What each listing holds</h3><ul><li>Type: sale, rent or land</li><li>Price and currency (KES, UGX, TZS, USD)</li><li>Exact location pinned on a map</li><li>Photos, checked for duplicates</li><li>Size in sqm or acres, bedrooms</li><li>Title / ownership status and proof document</li><li>The verified owner or agent behind it, with rating and deal history</li><li>Lifecycle: pending → live → paused / sold / let; relisting goes back through review</li></ul></section>
    <section class="panel stack"><h3>Controls that keep it safe</h3><ul><li>ID and phone verification before listing or paying</li><li>Pending queue with a document checklist the admin must complete before approval</li><li>Title deed or lease authority required for sale and land</li><li>Chat, offers and viewing appointments stay in-app; contact details are masked</li><li>Rate limits (${LISTING_LIMIT} listings a day, message bursts), duplicate-photo detection, user reports</li><li>Ratings only after a completed escrow deal, so they cannot be faked</li><li>Audit log of every moderation and escrow decision</li></ul></section>
    <section class="panel stack"><h3>Transaction flow</h3><ol><li>Buyer pays a deposit or rent into escrow by ${C().pay.join(', ').replace(/ \(.*?\)/g, '')}.</li><li>Seller is notified; a viewing is agreed in chat, then both sides confirm it happened, then both confirm handover.</li><li>Noble releases funds minus ${P().commission * 100}% commission and issues a deal record, or refunds if the deal falls through. Disputes go to an admin.</li><li>No viewing within ${P().viewingDays} days, or no handover within ${P().handoverDays} days of the viewing, refunds the buyer automatically.</li><li>Sales and land transfers finish offline at ${C().registry}; escrow covers the deposit and Noble records the agreement.</li></ol></section>
    <section class="panel stack"><h3>One product, many countries</h3><ul><li>Each country is a row of settings: currency, payment rails, accepted ID documents, land registry, agent register, deposit and deadline policy, local areas.</li><li>Live now in this demo: ${Object.values(COUNTRIES).map(c => c.name).join(', ')}.</li><li>UI in ${Object.values(LANGS).join(', ')}; production uses ICU message files per locale.</li><li>Prices formatted with Intl in the local currency; sizes in the local unit.</li><li>Backend: PostgreSQL + PostGIS schema, a tested escrow state machine, provider adapter contracts and an OpenAPI spec live in <span class="mono">backend/</span>.</li></ul></section>
    <section class="panel wide stack"><h3>Role permissions</h3><div class="tbl-wrap"><table><thead><tr><th>Action</th>${Object.values(ROLES).map(r => `<th class="c">${r.label}</th>`).join('')}</tr></thead><tbody>${PERMS.map(([a, ...v]) => `<tr><td>${a}</td>${v.map(x => `<td class="c ${x ? 'yes' : 'no'}">${x ? '✓' : '·'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="small muted">Try it: switch accounts at the top. Brian is unverified, so paying or messaging asks him to verify first. Grace is the admin.</p></section>
  </div>`;
}

/* ---------- Actions ---------- */
function sendMessage(th, text) {
  const u = me();
  const r = (S.rate['m' + u.id] || []).filter(t => Date.now() - t < MSG_BURST.ms);
  if (r.length >= MSG_BURST.n) { toast('Slow down: too many messages in 30 seconds.', true); return false; }
  S.rate['m' + u.id] = [...r, Date.now()];
  const masked = text.replace(/\+?\d[\d\s-]{7,}\d/g, '[number hidden]').replace(/[^\s@]+@[^\s@]+\.[a-z]{2,}/gi, '[email hidden]');
  th.messages.push({ from: u.id, text: masked, t: Date.now() });
  if (masked !== text) th.messages.push({ sys: 'Contact details were hidden. Keep chat and payments on Noble so escrow protects both of you.', t: Date.now() });
  notify(th.a === u.id ? th.b : th.a, `New message from ${u.name} about “${listing(th.listingId).title}”.`);
  return true;
}
function threadFor(l) {
  const u = me();
  let th = S.threads.find(t => t.listingId === l.id && (t.a === u.id || t.b === u.id));
  if (!th) { th = { id: 't' + Date.now(), listingId: l.id, a: u.id, b: l.ownerId, messages: [] }; S.threads.unshift(th); }
  return th;
}
function finishTxn(t, out, by) {
  const l = listing(t.listingId);
  t.status = out;
  if (out === 'released') {
    const fee = t.amount * polOf(t).commission;
    t.agreement = 'AGR-' + (hash(t.id) % 90000 + 10000);
    t.releasedAt = Date.now();
    t.log.push([Date.now(), `${money(t.amount - fee, t.currency)} released to ${user(t.seller).name}; ${money(fee, t.currency)} commission retained.`]);
    t.log.push([Date.now(), `Deal record ${t.agreement} issued to both parties.${l.type !== 'rent' ? ' Title transfer to complete offline.' : ''}`]);
    audit('Escrow released', `${t.id} · ${money(t.amount - fee, t.currency)} to ${user(t.seller).name}${by ? ' (' + by + ')' : ''}`, by ? me().name : 'System');
    notify(t.seller, `${money(t.amount - fee, t.currency)} released to you for “${l.title}”. Deal record ${t.agreement} is in Escrow.`);
    notify(t.buyer, `Escrow ${t.id} closed. Funds released to ${user(t.seller).name}. Deal record ${t.agreement} is in Escrow.`);
    if (l.status === 'approved') { l.status = 'closed'; l.closedAt = Date.now(); notify(t.seller, `“${l.title}” was marked as ${closedLabel(l).toLowerCase()} and removed from search.`); }
  } else {
    t.log.push([Date.now(), `${money(t.amount, t.currency)} refunded to ${user(t.buyer).name} via ${t.method}${by ? ' (' + by + ')' : ''}.`]);
    audit('Escrow refunded', `${t.id} · ${money(t.amount, t.currency)} to ${user(t.buyer).name}${by ? ' (' + by + ')' : ''}`, by === 'admin decision' ? me().name : 'System');
    notify(t.buyer, `Refund of ${money(t.amount, t.currency)} sent for “${l.title}”.`);
    notify(t.seller, `Escrow ${t.id} refunded to the buyer.`);
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (S.drawer && !e.target.closest('.drawer') && !(el && el.dataset.act === 'drawer')) { S.drawer = false; renderChrome(); }
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, u = me();
  if (a === 'close-scrim') { if (e.target === el) modal(''); return; }
  switch (a) {
    case 'go': S.view = el.dataset.view; break;
    case 'filter': S.filter = el.dataset.f; break;
    case 'savedonly': S.q.saved = !S.q.saved; break;
    case 'select': S.selected = id; renderBrowseResults(); document.querySelector(`.lcard[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return;
    case 'open': { const l = listing(id); S.selected = id; S.photoIdx = 0; S.view = 'listing'; if (l && l.ownerId !== u.id && u.role !== 'admin') l.views = (l.views || 0) + 1; window.scrollTo(0, 0); break; }
    case 'ph': S.photoIdx = +el.dataset.i; break;
    case 'save': {
      if (!gate()) return;
      const arr = S.saved[u.id] = S.saved[u.id] || [];
      const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id);
      if (S.view === 'browse') { renderBrowseResults(); return; }
      break;
    }
    case 'copylink': copyText(location.href.split('#')[0] + '#' + id, el); return;
    case 'copyrecord': copyText(dealRecord(S.txns.find(t => t.id === id)), el); return;
    case 'record': openRecord(S.txns.find(t => t.id === id)); return;
    case 'drawer': S.drawer = !S.drawer; (S.notes[u.id] || []).forEach(n => n.read = true); renderChrome(); return;
    case 'reset': S = seed(); toast('Demo data reset.'); break;
    case 'verify': openVerify(); return;
    case 'close-modal': modal(''); return;
    case 'otp': { const hint = $('#otp-hint'); S.otp = String(1000 + hash(String(Date.now())) % 9000); hint.innerHTML = `Code sent. <b>Demo code: <span class="mono">${S.otp}</span></b>`; return; }
    case 'message': if (!gate()) return; S.thread = threadFor(listing(id)).id; S.view = 'messages'; break;
    case 'pay': if (!gate()) return; openPay(listing(id)); return;
    case 'report': if (!gate()) return; openReport(listing(id)); return;
    case 'thread': S.thread = id; break;
    case 'offerans': {
      const th = S.threads.find(t => t.id === S.thread), m = th.messages[+el.dataset.i], l = listing(th.listingId);
      m.offer.status = el.dataset.ans;
      th.messages.push({ sys: `${u.name} ${el.dataset.ans} the offer of ${money(m.offer.amount, l.currency)}.${el.dataset.ans === 'accepted' ? ' The buyer can now pay into escrow at this price.' : ''}`, t: Date.now() });
      notify(m.from, `Your offer on “${l.title}” was ${el.dataset.ans}.`);
      break;
    }
    case 'viewans': {
      const th = S.threads.find(t => t.id === S.thread), m = th.messages[+el.dataset.i], l = listing(th.listingId);
      m.viewing.status = el.dataset.ans;
      if (el.dataset.ans === 'accepted') {
        th.messages.push({ sys: `Viewing agreed for ${fmtWhen(m.viewing.when)}. Both sides confirm it happened from the Escrow tab afterwards.`, t: Date.now() });
        const t = S.txns.find(x => x.listingId === l.id && x.status === 'held' && (x.buyer === th.a || x.buyer === th.b));
        if (t) t.log.push([Date.now(), `Viewing scheduled for ${fmtWhen(m.viewing.when)}.`]);
        notify(m.from, `${u.name} accepted the viewing on ${fmtWhen(m.viewing.when)} for “${l.title}”.`);
      } else {
        th.messages.push({ sys: `${u.name} asked for another time. Propose a new slot below.`, t: Date.now() });
        notify(m.from, `${u.name} can't make the viewing on ${fmtWhen(m.viewing.when)}. Suggest another time.`);
      }
      break;
    }
    case 'confirm': {
      const t = S.txns.find(x => x.id === id), st = el.dataset.stage, side = el.dataset.side;
      t[st][side] = true;
      t.log.push([Date.now(), `${u.name} confirmed the ${st}.`]);
      notify(side === 'buyer' ? t.seller : t.buyer, `${u.name} confirmed the ${st} for ${t.id}.`);
      if (st === 'viewing' && t.viewing.buyer && t.viewing.seller) { t.viewingAt = Date.now(); t.log.push([Date.now(), 'Viewing confirmed by both sides.']); }
      if (t.handover.buyer && t.handover.seller) { t.log.push([Date.now(), 'Handover confirmed by both sides.']); finishTxn(t, 'released'); toast('Handover confirmed by both sides. Funds released.'); }
      break;
    }
    case 'refundreq': {
      const t = S.txns.find(x => x.id === id);
      if (u.id === t.seller) { finishTxn(t, 'refunded', 'cancelled by seller'); toast('Buyer refunded.'); break; }
      t.status = 'disputed'; t.disputeBy = 'buyer';
      t.log.push([Date.now(), `${u.name} requested a refund. Waiting for the seller to agree, or an admin decision.`]);
      notify(t.seller, `${u.name} requested a refund on ${t.id}.`);
      toast('Refund requested. The seller or an admin will respond.');
      break;
    }
    case 'resolve': { const t = S.txns.find(x => x.id === id); finishTxn(t, el.dataset.out, u.role === 'admin' ? 'admin decision' : 'agreed by seller'); toast(el.dataset.out === 'refunded' ? 'Refund sent.' : 'Funds released.'); break; }
    case 'rate': {
      const t = S.txns.find(x => x.id === id), to = u.id === t.buyer ? t.seller : t.buyer;
      if (S.ratings.some(r => r.txnId === t.id && r.from === u.id)) return;
      S.ratings.push({ txnId: t.id, from: u.id, to, stars: +el.dataset.stars, t: Date.now() });
      notify(to, `${u.name} rated you ${el.dataset.stars} star${el.dataset.stars > 1 ? 's' : ''} for ${t.id}.`);
      toast('Thanks, your rating is saved.');
      break;
    }
    case 'close': { const l = listing(id); l.status = 'closed'; l.closedAt = Date.now(); toast(`Marked as ${closedLabel(l).toLowerCase()} and removed from search.`); break; }
    case 'pause': { listing(id).status = 'paused'; toast('Listing paused. It is hidden from search until you resume it.'); break; }
    case 'resume': { listing(id).status = 'approved'; toast('Listing is live again.'); break; }
    case 'relist': { const l = listing(id); l.status = 'pending'; l.rejectReason = null; l.adminChecks = {}; l.created = Date.now(); notify('u4', `Relisted by ${u.name}: “${l.title}” is waiting for review.`); toast('Relisted. An admin will review it again before it goes live.'); break; }
    case 'atab': S.adminTab = el.dataset.t; break;
    case 'approve': { const l = listing(id); l.status = 'approved'; l.created = Date.now(); audit('Approved listing', l.title); notify(l.ownerId, `“${l.title}” was approved and is now live.`); toast('Listing approved and live.'); break; }
    case 'reject': { const l = listing(id); l.status = 'rejected'; l.rejectReason = $('#rej-' + id).value; audit('Rejected listing', `${l.title} · ${l.rejectReason}`); notify(l.ownerId, `“${l.title}” was rejected: ${l.rejectReason}.`); toast('Listing rejected. The lister was told why.'); break; }
    case 'dismiss': { const r = S.reports.find(x => x.id === id); r.status = 'dismissed'; audit('Dismissed report', listing(r.listingId).title); toast('Report dismissed.'); break; }
    case 'takedown': { const r = S.reports.find(x => x.id === id), l = listing(r.listingId); r.status = 'actioned'; l.status = 'removed'; audit('Took listing down', `${l.title} · report by ${user(r.by).name}`); notify(l.ownerId, `“${l.title}” was taken down after a report.`); notify(r.by, `Thanks. “${l.title}” was taken down.`); toast('Listing taken down.'); break; }
    case 'suspend': { const x = user(id); x.suspended = !x.suspended; audit(x.suspended ? 'Suspended account' : 'Reinstated account', x.name); toast(x.suspended ? `${x.name} suspended.` : `${x.name} reinstated.`); break; }
    case 'pickph': {
      const d = S.draft, p = el.dataset.p;
      d.photos = d.photos.includes(p) ? d.photos.filter(x => x !== p) : d.photos.length >= 5 ? (toast('Up to 5 photos per listing.', true), d.photos) : [...d.photos, p];
      keepDraft(); break;
    }
    case 'pick': {
      const svg = el, pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const c = pt.matrixTransform(svg.getScreenCTM().inverse());
      keepDraft(); S.draft.x = +c.x.toFixed(1); S.draft.y = +c.y.toFixed(1); break;
    }
    default: return;
  }
  render();
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]') && e.target.tagName !== 'BUTTON') { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (e.key === 'Escape' && $('#modal').innerHTML) modal('');
});
function keepDraft() {
  const f = document.querySelector('form[data-form="listing"]'); if (!f) return;
  const fd = new FormData(f);
  for (const k of ['type', 'title', 'price', 'currency', 'size', 'unit', 'beds', 'titleStatus', 'client']) if (fd.has(k)) S.draft[k] = fd.get(k);
  S.draft.proofName = f.proof.files[0]?.name || S.draft.proofName;
}
document.addEventListener('input', e => {
  if (e.target.id === 'q-text') { S.q.text = e.target.value; renderBrowseResults(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'as') { S.me = t.value; S.drawer = false; S.q.saved = false; if (['listing', 'sell', 'admin', 'messages'].includes(S.view)) S.view = 'browse'; render(); toast(`Now viewing as ${me().name}.`); return; }
  if (t.id === 'f-type') { keepDraft(); render(); return; }
  if (t.id === 'f-proof') { keepDraft(); render(); return; }
  if (t.id === 'country') { S.country = t.value; S.q = { ...S.q, place: 'all', min: '', max: '' }; S.selected = null; S.draft = null; if (S.view === 'listing') S.view = 'browse'; render(); toast(`Now browsing ${C().name} in ${C().currency}.`); return; }
  if (t.id === 'lang') { S.lang = t.value; render(); return; }
  const qmap = { 'q-place': 'place', 'q-min': 'min', 'q-max': 'max', 'q-sort': 'sort', 'q-beds': 'beds' };
  if (qmap[t.id]) { S.q[qmap[t.id]] = t.value; renderBrowseResults(); return; }
  if (t.dataset.chk) { const l = listing(t.dataset.id); (l.adminChecks = l.adminChecks || {})[t.dataset.chk] = t.checked; render(); }
});

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const fd = new FormData(f), u = me(), kind = f.dataset.form;
  if (kind === 'verify') {
    if (!S.otp || fd.get('otp') !== S.otp) { toast('That code does not match. Tap “Send code” and enter the 4 digits shown.', true); return; }
    u.verified = true; u.idNo = '•••• ' + String(fd.get('idno')).slice(-4); u.phone = String(fd.get('phone'));
    modal(''); toast('Verified. You can now list, message and pay.'); render();
    return;
  }
  if (kind === 'msg') {
    const text = String(fd.get('text') || '').trim(); if (!text) return;
    if (!gate()) return;
    if (sendMessage(S.threads.find(t => t.id === S.thread), text)) render();
    return;
  }
  if (kind === 'offer') {
    if (!gate()) return;
    const l = listing(f.dataset.id), amt = +fd.get('amt');
    if (!(amt > 0)) { toast('Enter an offer amount.', true); return; }
    const th = threadFor(l);
    th.messages.push({ from: u.id, offer: { amount: amt, status: 'pending' }, t: Date.now() });
    notify(l.ownerId, `${u.name} offered ${money(amt, l.currency)} on “${l.title}”.`);
    S.thread = th.id; S.view = 'messages'; toast('Offer sent.'); render(); return;
  }
  if (kind === 'viewing') {
    if (!gate()) return;
    const when = fd.get('when'); if (!when) { toast('Pick a date and time for the viewing.', true); return; }
    const th = S.threads.find(t => t.id === S.thread), l = listing(th.listingId);
    th.messages.push({ from: u.id, viewing: { when: new Date(when).toISOString(), status: 'pending' }, t: Date.now() });
    notify(th.a === u.id ? th.b : th.a, `${u.name} proposed a viewing of “${l.title}” on ${fmtWhen(when)}.`);
    toast('Viewing proposed.'); render(); return;
  }
  if (kind === 'pay') {
    const l = listing(f.dataset.id), price = agreedPrice(l, u.id), dep = depositFor(l, price), method = String(fd.get('method')).replace(/\s*\(.*\)$/, '');
    const t = { id: 'ESC-' + (20000 + hash(String(Date.now())) % 9999), listingId: l.id, buyer: u.id, seller: l.ownerId, kind: l.type === 'rent' ? 'rent' : 'deposit', amount: dep, price, currency: l.currency, method, policy: (COUNTRIES[l.country] || C()).policy,
      status: 'held', paidAt: Date.now(), viewing: { buyer: false, seller: false }, handover: { buyer: false, seller: false },
      log: [[Date.now(), `${money(dep, l.currency)} received via ${method}.`], [Date.now(), `${user(l.ownerId).name} notified.`]] };
    S.txns.unshift(t);
    notify(l.ownerId, `${u.name} paid ${money(dep, l.currency)} into escrow for “${l.title}”. Arrange the viewing in Messages.`);
    modal(''); S.view = 'escrow'; toast(`${money(dep, l.currency)} is now held in escrow.`); render(); return;
  }
  if (kind === 'report') {
    const l = listing(f.dataset.id);
    S.reports.unshift({ id: 'r' + Date.now(), listingId: l.id, by: u.id, reason: fd.get('reason') + (fd.get('det') ? ': ' + fd.get('det') : ''), t: Date.now(), status: 'open' });
    modal(''); toast('Report sent to the moderation team.'); render(); return;
  }
  if (kind === 'listing') {
    keepDraft();
    if (!gate()) return;
    const d = S.draft;
    const recent = (S.rate[u.id] || []).filter(t => Date.now() - t < 24 * H);
    if (recent.length >= LISTING_LIMIT) { toast('Daily listing limit reached.', true); return; }
    if (d.x == null) { toast('Drop a pin on the map to set the exact location.', true); return; }
    if (!d.photos.length) { toast('Add at least one photo.', true); return; }
    if (d.type !== 'rent' && !d.proofName) { toast('Sale and land listings need a title deed or ownership document.', true); return; }
    S.listings.unshift({ id: 'l' + Date.now().toString(36), country: S.country, type: d.type, title: d.title, price: +d.price, currency: d.currency || C().currency, place: nearestPlace(d.x, d.y), x: d.x, y: d.y,
      size: +d.size, unit: d.unit || 'sqm', beds: +d.beds || 0, titleStatus: d.titleStatus, ownerId: u.id, status: 'pending', photos: d.photos, created: Date.now(), views: 0, adminChecks: {},
      proof: d.proofName ? { file: d.proofName } : null, clientOwner: d.client || null });
    S.rate[u.id] = [...recent, Date.now()];
    notify('u4', `New listing from ${u.name} waiting for review.`);
    S.draft = null; toast('Submitted. An admin will review it before it goes live.'); render();
  }
});

/* Deep link: #l2 opens that listing */
{ const h = (location.hash || '').slice(1); const l = /^[a-z][a-z0-9]+$/.test(h) && listing(h); if (l && l.status === 'approved') { S.country = l.country; S.selected = l.id; S.view = 'listing'; } }
render();
})();
