<style>

.convo { display: grid; grid-template-rows: auto minmax(0,1fr) auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; } .convo header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.msgs { padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 440px; } .msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; background: var(--sunk); overflow-wrap: anywhere; } .msg.me { align-self: flex-end; background: var(--accent-soft); } .msg .t { font-size: .72rem; color: var(--muted); margin-top: 2px; }

.steps { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); margin: 6px 0 4px; list-style: none; padding: 0; } .steps li { position: relative; padding-top: 22px; font-size: .78rem; color: var(--muted); text-align: center; padding-inline: 4px; }

.steps li.done { color: var(--ink); } .steps li.done::before { background: var(--escrow); border-color: var(--escrow); } .steps li.done::after { background: var(--escrow); } .steps li.fail::before { background: var(--bad); border-color: var(--bad); }
.split { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; } .split div { background: var(--sunk); border-radius: 8px; padding: 10px; min-width: 0; } .split b { display: block; font-family: var(--f-mono); font-weight: 500; overflow-wrap: anywhere; }
.confirms { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; } .confirm { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .88rem; } .confirm .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; } .confirm.on .dot { background: var(--ok); }

.stars button { background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: var(--line); padding: 0 2px; } .stars:hover button { color: var(--star); } .stars button:hover ~ button { color: var(--line); }

.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; } .qcard { display: grid; grid-template-columns: 160px minmax(0,1fr) auto; gap: 16px; align-items: start; }
.checks { display: grid; gap: 4px; font-size: .86rem; margin: 0; padding: 0; } .checks li { list-style: none; display: flex; gap: 8px; }
.chk { display: grid; gap: 6px; font-size: .86rem; background: var(--sunk); border-radius: 8px; padding: 10px; } .chk label { display: flex; gap: 8px; align-items: start; cursor: pointer; } .chk input { margin-top: 3px; }
.tbl-wrap { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: .88rem; } th,td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; } th { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; } .yes { color: var(--ok); font-weight: 700; } .no { color: var(--muted); }

.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.signin { max-width: 440px; margin: 40px auto; }

<body>
<header class="topbar"><div class="wrap"><div class="bar"><div class="brand"><b>Noble</b><span>property marketplace</span></div><div class="who" id="who"></div></div><nav class="tabs" id="tabs" aria-label="Sections"></nav></div></header>
<main class="wrap" id="app"><div class="empty">Loading…</div></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal"></div>
<script>
(() => {
'use strict';
/* ---------- API client ---------- */
const qs = new URLSearchParams(location.search);
const API = (qs.get('api') || localStorage.getItem('noble_api') || (location.protocol.startsWith('http') ? location.origin : 'http://localhost:8080')).replace(/\/$/, '');
if (qs.get('api')) localStorage.setItem('noble_api', API);
let TOKEN = localStorage.getItem('noble_token') || null;
class ApiError extends Error { constructor(status, data) { super(data?.message || `HTTP ${status}`); this.status = status; this.code = data?.code; this.data = data; } }
async function api(method, path, body, opts = {}) {
  const headers = { ...(TOKEN ? { Authorization: `Bearer ${TOKEN}` } : {}), ...(opts.contentType ? { 'Content-Type': opts.contentType } : body !== undefined ? { 'Content-Type': 'application/json' } : {}) };
  const res = await fetch(API + path, { method, headers, body: opts.raw ?? (body !== undefined ? JSON.stringify(body) : undefined) });
  const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new ApiError(res.status, data);
  return data;
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => String(n || '?').split(' ').map(p => p[0]).slice(0, 2).join('');
const ago = t => { const m = Math.round((Date.now() - Date.parse(t)) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + 'm ago'; const h = Math.round(m / 60); return h < 48 ? h + 'h ago' : Math.round(h / 24) + 'd ago'; };
const fmtDate = t => new Date(t).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtWhen = t => new Date(t).toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const typeLabel = { sale: 'For sale', rent: 'For rent', land: 'Land' };
function toast(text, bad) { const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = text; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 4200); }
function modal(html) { $('#modal').innerHTML = html ? `<div class="scrim" data-act="close-scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>` : ''; const f = $('#modal input, #modal select, #modal button'); if (f) f.focus(); }

/* ---------- State ---------- */
const S = { view: 'browse', country: localStorage.getItem('noble_country') || 'KE', countries: [], me: null, q: { text: '', type: 'all', min: '', max: '', beds: '0', sort: 'newest', saved: false }, selected: null, photoIdx: 0, thread: null, adminTab: 'queue', cache: {} };
const C = () => S.countries.find(c => c.code === S.country) || S.countries[0] || { code: 'KE', currency: 'KES', name: 'Kenya', center: { lat: -1.29, lng: 36.82 }, payment_methods: [], id_document_types: [], policy: {} };
const money = (minor, cur) => { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(minor / 100); } catch { return `${cur} ${(minor / 100).toLocaleString()}`; } };
const methodLabel = m => ({ mpesa: 'M-Pesa', mpesa_tz: 'M-Pesa', airtel_money: 'Airtel Money', mtn_momo: 'MTN MoMo', tigo_pesa: 'Tigo Pesa', card: 'Card', bank_transfer: 'Bank transfer', ussd: 'USSD', eft: 'Instant EFT', open_banking: 'Open Banking', ach: 'ACH bank transfer' }[m] || m);
const docLabel = d => ({ national_id: 'National ID', passport: 'Passport', nin: 'NIN', drivers_licence: "Driver's licence", ghana_card: 'Ghana Card', sa_id: 'SA ID', nida_id: 'NIDA ID', brp: 'BRP', state_id: 'State ID' }[d] || d);
const verified = () => S.me && (S.me.verified || S.me.role === 'admin');

/* Map: a survey-style sketch. Pins are projected from lat/lng around the country centre. */
const BOX = { dlng: 0.32, dlat: 0.2 };
const toXY = (lat, lng) => { const c = C().center; return { x: 50 + (lng - c.lng) / BOX.dlng * 50, y: 33 - (lat - c.lat) / BOX.dlat * 33 }; };
const fromXY = (x, y) => { const c = C().center; return { lng: +(c.lng + (x - 50) / 50 * BOX.dlng).toFixed(5), lat: +(c.lat - (y - 33) / 33 * BOX.dlat).toFixed(5) }; };
function mapSVG({ listings = [], pick = false, draft = null } = {}) {
  const pins = listings.map(l => { const p = toXY(l.lat, l.lng), sel = S.selected === l.id; if (p.x < 0 || p.x > 100 || p.y < 0 || p.y > 66) return ''; return `<g class="pin" data-act="select" data-id="${l.id}" tabindex="0" role="button" aria-label="${esc(l.title)}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${sel ? 3.2 : 2.3}" fill="var(--${l.type})" stroke="var(--surface)" stroke-width=".8"/>${sel ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="none" stroke="var(--${l.type})" stroke-width=".5"/>` : ''}</g>`; }).join('');
  const d = draft ? toXY(draft.lat, draft.lng) : null;
  return `<svg class="map" viewBox="0 0 100 66" ${pick ? 'data-act="pick" style="cursor:crosshair"' : ''} aria-label="Map of ${esc(C().name)}">
    <rect width="100" height="66" fill="var(--map-land)"/><path d="M0 47 C18 44 30 48 44 45 S70 40 100 36" stroke="var(--map-water)" stroke-width="2.2" fill="none"/>
    <path d="M47 0 C49 18 53 26 52 34 S58 50 62 66" stroke="var(--map-road)" stroke-width="1.4" fill="none"/><path d="M0 30 C20 31 40 36 52 34 S80 28 100 22" stroke="var(--map-road)" stroke-width="1.4" fill="none"/><path d="M52 34 L80 46 L92 66" stroke="var(--map-road)" stroke-width="1" fill="none"/><path d="M52 34 L70 18 L100 6" stroke="var(--map-road)" stroke-width="1" fill="none"/>
    <text x="50" y="37" font-size="2.4" text-anchor="middle">${esc(C().name)} · centre</text><text x="97" y="63" font-size="2.2" text-anchor="end">N ↑ · ≈ ${Math.round(BOX.dlng * 111 * 2)} km across</text>
    ${pins}${d ? `<g><circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="2.6" fill="var(--accent)" stroke="var(--surface)" stroke-width=".8"/><circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="5" fill="none" stroke="var(--accent)" stroke-width=".4" stroke-dasharray="1 1"/></g>` : ''}</svg>`;
}

function statusPill(l) { return { approved: '<span class="pill ok">Live</span>', pending: '<span class="pill warn">Pending review</span>', rejected: '<span class="pill bad">Rejected</span>', removed: '<span class="pill bad">Taken down</span>', paused: '<span class="pill">Paused</span>', closed: `<span class="pill info">${l.type === 'rent' ? 'Let' : 'Sold'}</span>` }[l.status] || ''; }

}

async function vMessages() {
  const u = S.me, ths = await api('GET', '/threads');
  if (!ths.length) return '<div class="page-head"><h2>Messages</h2></div><div class="empty">No conversations yet. Open a listing and message the owner.</div>';
  const th = ths.find(t => t.id === S.thread) || ths[0]; S.thread = th.id;
  const other = th.buyer.id === u.id ? th.owner : th.buyer, l = th.listing;
  const bubbles = th.messages.map(m => {
    if (m.kind === 'system') return `<div class="sys">${esc(m.body)}</div>`;
    const mine = m.sender_id === u.id, who = `<div class="t">${mine ? 'You' : esc(other.full_name.split(' ')[0])} · ${ago(m.created_at)}</div>`;
    const dec = { pending: '<span class="pill warn">Awaiting reply</span>', accepted: '<span class="pill ok">Accepted</span>', declined: '<span class="pill">Declined</span>', expired: '<span class="pill">Expired</span>' }[m.decision];
    const btns = !mine && m.decision === 'pending' ? `<button class="btn small" data-act="decide" data-id="${m.id}" data-d="accepted">Accept</button><button class="btn ghost small" data-act="decide" data-id="${m.id}" data-d="declined">Decline</button>` : '';
    if (m.kind === 'offer') return `<div class="msg offer ${mine ? 'me' : ''}"><div class="label">Offer${l.type === 'rent' ? ' / month' : ''}</div><div class="price">${money(m.offer_minor, l.currency)}</div><div class="row small">${dec}${btns}</div>${who}</div>`;
    if (m.kind === 'viewing') return `<div class="msg viewing ${mine ? 'me' : ''}"><div class="label">Viewing proposed</div><div><b>${fmtWhen(m.viewing_at)}</b></div><div class="row small">${dec}${btns}</div>${who}</div>`;
    return `<div class="msg ${mine ? 'me' : ''}">${esc(m.body)}${who}</div>`;
  }).join('');
  const minWhen = new Date(Date.now() + 3600e3).toISOString().slice(0, 16);

async function vEscrow() {
  const list = await api('GET', '/transactions'), c = C();
  return `<div class="page-head"><div><h2>Escrow</h2><p class="muted">Money is held by Noble until both sides confirm the viewing and the handover. Commission in ${esc(c.name)} is ${c.policy.commission_pct}% on release.</p></div></div><div class="stack">${list.map(txnCard).join('') || '<div class="empty">No escrow payments yet.</div>'}</div>`;
}
function txnCard(t) {
  const u = S.me, isB = u.id === t.buyer.id, isS = u.id === t.seller.id, cf = t.confirmations, v = cf.viewing_buyer && cf.viewing_seller, h = cf.handover_buyer && cf.handover_seller, av = t.available_transitions;
  const steps = [['Paid into escrow', ['held', 'viewing_confirmed', 'disputed', 'released', 'refunded'].includes(t.state)], ['Seller notified', ['held', 'viewing_confirmed', 'disputed', 'released', 'refunded'].includes(t.state)], ['Viewing confirmed', v], ['Handover confirmed', h], [t.state === 'refunded' ? 'Refunded to buyer' : 'Released to seller', ['released', 'refunded'].includes(t.state)]];
  const pill = { initiated: '<span class="pill">Starting</span>', payment_pending: '<span class="pill warn">Awaiting payment</span>', held: '<span class="pill escrow">Held in escrow</span>', viewing_confirmed: '<span class="pill escrow">Held · viewing done</span>', disputed: '<span class="pill warn">Refund requested</span>', released: '<span class="pill ok">Released</span>', refunded: '<span class="pill bad">Refunded</span>', expired: '<span class="pill bad">Payment not completed</span>' }[t.state];
  const conf = (stage, side, who) => { const on = cf[`${stage}_${side}`], can = av.includes(`confirm_${stage}`) && ((side === 'buyer' && isB) || (side === 'seller' && isS)) && !on; return `<div class="confirm ${on ? 'on' : ''}"><span class="dot"></span><span style="flex:1">${who} confirms ${stage}</span>${can ? `<button class="btn small" data-act="transition" data-id="${t.id}" data-t="confirm_${stage}">Confirm</button>` : on ? '<span class="small yes">done</span>' : ''}</div>`; };
  const fee = t.commission_minor ?? Math.round(t.amount_minor * (C().policy.commission_pct || 5) / 100);
  let acts = '';
  if (av.includes('seller_cancel')) acts += `<button class="btn ghost danger" data-act="transition" data-id="${t.id}" data-t="seller_cancel">Cancel deal · refund buyer</button>`;
  if (av.includes('open_dispute')) acts += `<button class="btn ghost danger" data-act="dispute" data-id="${t.id}">Deal fell through · request refund</button>`;
  if (av.includes('seller_agrees_refund')) acts += `<button class="btn" data-act="transition" data-id="${t.id}" data-t="seller_agrees_refund">Agree to refund</button>`;
  if (u.role === 'admin' && t.state === 'disputed') acts += `<button class="btn" data-act="resolve" data-id="${t.id}" data-t="admin_refund">Refund buyer</button><button class="btn escrow" data-act="resolve" data-id="${t.id}" data-t="release">Release to seller</button>`;
  if (t.state === 'released') acts += `<button class="btn" data-act="record" data-id="${t.id}">View deal record</button>`;
  if (t.redirect_url && t.state === 'payment_pending') acts += `<a class="btn escrow" href="${esc(t.redirect_url)}" target="_blank" rel="noopener">Complete payment</a>`;
  const otherName = esc((isB ? t.seller : t.buyer).full_name.split(' ')[0]);
  const rating = t.state === 'released' && (isB || isS) ? (t.my_rating ? `<div class="small">You rated ${otherName} <span class="star">${'★'.repeat(t.my_rating)}</span><span class="muted">${'★'.repeat(5 - t.my_rating)}</span></div>` : `<div class="row small"><span>Rate ${otherName}:</span><span class="stars">${[1, 2, 3, 4, 5].map(n => `<button data-act="rate" data-id="${t.id}" data-stars="${n}" aria-label="${n} stars">★</button>`).join('')}</span></div>`) : '';
  const deadline = t.state === 'held' && t.viewing_deadline ? `Auto-refund on <b>${fmtDate(t.viewing_deadline)}</b> unless both sides confirm the viewing.` : t.state === 'viewing_confirmed' && t.handover_deadline ? `Auto-refund on <b>${fmtDate(t.handover_deadline)}</b> unless both sides confirm the handover.` : '';
  return `<article class="panel stack"><div class="row" style="justify-content:space-between"><div><span class="mono small muted">${t.reference}</span><h3>${esc(t.buyer.full_name)} → ${esc(t.seller.full_name)}</h3><div class="small muted">${methodLabel(t.gateway.replace('sandbox:', ''))}${t.gateway.startsWith('sandbox') ? ' (sandbox)' : ''} · ${t.paid_at ? 'paid ' + fmtDate(t.paid_at) : 'not paid yet'}</div></div>${pill}</div>
    <ol class="steps">${steps.map(([n, d], i) => `<li class="${d ? (i === 4 && t.state === 'refunded' ? 'done fail' : 'done') : ''}">${n}</li>`).join('')}</ol>
    <div class="split"><div><span class="label">Held</span><b>${money(t.amount_minor, t.currency)}</b></div><div><span class="label">Noble commission</span><b>${money(fee, t.currency)}</b></div><div><span class="label">Seller receives</span><b>${money(t.amount_minor - fee, t.currency)}</b></div></div>
    ${deadline ? `<div class="notice small">${deadline}</div>` : ''}${t.dispute ? `<div class="notice warn small">Dispute: ${esc(t.dispute.reason)}</div>` : ''}${t.refund_reason ? `<div class="notice small">Refunded: ${esc(t.refund_reason)}</div>` : ''}
    ${['held', 'viewing_confirmed'].includes(t.state) ? `<div class="confirms">${conf('viewing', 'buyer', esc(t.buyer.full_name.split(' ')[0]))}${conf('viewing', 'seller', esc(t.seller.full_name.split(' ')[0]))}${conf('handover', 'buyer', esc(t.buyer.full_name.split(' ')[0]))}${conf('handover', 'seller', esc(t.seller.full_name.split(' ')[0]))}</div>` : ''}
    ${rating}${acts ? `<div class="row">${acts}</div>` : ''}
    <details><summary class="small muted" style="cursor:pointer">History (${t.history.length})</summary><ol class="log">${t.history.map(x => `<li><span class="mono">${fmtWhen(x.at)}</span> · ${x.transition} (${x.actor})</li>`).join('')}</ol></details></article>`;
}

/* ---------- Render & boot ---------- */
const VIEWS = { signin: vSignin, browse: vBrowse, listing: vListing, sell: vSell, messages: vMessages, escrow: vEscrow, admin: vAdmin };
let rendering = false;
async function render() {
  if (!S.me && !['browse', 'listing', 'signin'].includes(S.view)) S.view = 'signin';
  renderChrome();
  try { $('#app').innerHTML = await (VIEWS[S.view] || vBrowse)(); }
  catch (e) { if (e.status === 401) { TOKEN = null; localStorage.removeItem('noble_token'); S.me = null; S.view = 'signin'; renderChrome(); $('#app').innerHTML = await vSignin(); toast('Please sign in again.', true); } else $('#app').innerHTML = `<div class="empty">Could not load: ${esc(e.message)}<br><span class="small">API: ${esc(API)}</span></div>`; }
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  try { history.replaceState(null, '', S.view === 'listing' && S.selected ? '#' + S.selected : location.pathname + location.search); } catch {}
}
async function refreshMe() { if (!TOKEN) { S.me = null; return; } try { S.me = await api('GET', '/me'); } catch (e) { if (e.status === 401 || e.status === 403) { TOKEN = null; localStorage.removeItem('noble_token'); S.me = null; if (e.status === 403) toast(e.message, true); } } }
async function act(fn) { try { await fn(); } catch (e) { if (e.status === 403 && /verification/.test(e.message)) openVerify(); else if (e.status === 401) { S.view = 'signin'; await render(); toast('Sign in to do that.', true); } else toast(e.message || 'Something went wrong', true); } }
const needAuth = () => { if (!S.me) { S.view = 'signin'; render(); toast('Sign in to do that.', true); return false; } return true; };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'close-scrim') { if (e.target === el) modal(''); return; }
  act(async () => {
    switch (a) {
      case 'go': S.view = el.dataset.view; break;
      case 'close-modal': modal(''); return;
      case 'signout': TOKEN = null; localStorage.removeItem('noble_token'); S.me = null; S.view = 'browse'; break;
      case 'otp-reset': S.otpSent = false; S.devCode = null; break;
      case 'filter': S.q.type = el.dataset.f; break;
      case 'savedonly': S.q.saved = !S.q.saved; break;
      case 'select': S.selected = id; break;
      case 'open': S.selected = id; S.photoIdx = 0; S.view = 'listing'; window.scrollTo(0, 0); break;
      case 'ph': S.photoIdx = +el.dataset.i; break;
      case 'verify': openVerify(); return;
      case 'save': { if (!needAuth()) return; await api(el.getAttribute('aria-pressed') === 'true' || /Saved/.test(el.textContent) ? 'DELETE' : 'PUT', `/listings/${id}/save`); break; }
      case 'copylink': await navigator.clipboard.writeText(location.href.split('#')[0] + '#' + id).catch(() => {}); toast('Link copied'); return;
      case 'copy': await navigator.clipboard.writeText(el.dataset.text).catch(() => {}); toast('Copied'); return;
      case 'message': { if (!needAuth()) return; const th = await api('POST', '/threads', { listing_id: id }); S.thread = th.id; S.view = 'messages'; break; }
      case 'pay': if (!needAuth()) return; openPay(S.cache.listing); return;
      case 'report': if (!needAuth()) return; openReport(S.cache.listing); return;
      case 'status': await api('POST', `/listings/${id}/status`, { action: el.dataset.a }); toast('Updated'); break;
      case 'thread': S.thread = id; break;
      case 'decide': await api('POST', `/messages/${id}/decision`, { decision: el.dataset.d }); break;
      case 'transition': await api('POST', `/transactions/${id}/transitions`, { transition: el.dataset.t }); toast('Done'); break;
      case 'dispute': openDispute(id); return;
      case 'resolve': await api('POST', `/admin/transactions/${id}/resolve`, { transition: el.dataset.t }); toast('Resolved'); break;
      case 'record': await openRecord(id); return;
      case 'rate': await api('POST', `/transactions/${id}/rating`, { stars: +el.dataset.stars }); toast('Thanks, your rating is saved.'); break;
      case 'atab': S.adminTab = el.dataset.t; break;
      case 'approve': { const checks = Object.fromEntries([...document.querySelectorAll(`input[data-chk][data-id="${id}"]`)].map(i => [i.dataset.chk, i.checked])); await api('POST', `/admin/listings/${id}/review`, { decision: 'approve', checks }); toast('Listing approved and live.'); break; }
      case 'reject': await api('POST', `/admin/listings/${id}/review`, { decision: 'reject', reject_reason: $('#rej-' + id).value }); toast('Listing rejected.'); break;
      case 'report-resolve': await api('POST', `/admin/reports/${id}/resolve`, { action: el.dataset.a }); break;
      case 'suspend': await api('POST', `/admin/users/${id}/suspend`, { suspended: el.dataset.on === 'true', reason: 'policy' }); break;
      case 'pick': { const pt = el.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(el.getScreenCTM().inverse()); keepDraft(); Object.assign(S.draft, fromXY(p.x, p.y)); break; }
      default: return;
    }
    await render();
  });
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]') && e.target.tagName !== 'BUTTON') { e.preventDefault(); e.target.click(); } if (e.key === 'Escape') modal(''); });
function keepDraft() { const f = document.querySelector('form[data-form="listing"]'); if (!f) return; const fd = new FormData(f); for (const [k, v] of fd) S.draft[k] = v; }
let qTimer;
document.addEventListener('input', e => { if (e.target.id === 'q-text') { S.q.text = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(async () => { const r = await api('GET', `/listings?${new URLSearchParams({ country: C().code, q: S.q.text, ...(S.q.type !== 'all' ? { type: S.q.type } : {}), sort: S.q.sort })}`); const lg = $('#ledger'); if (lg) lg.innerHTML = r.items.map(card).join('') || '<div class="empty">Nothing matches.</div>'; }, 250); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'country') { S.country = t.value; localStorage.setItem('noble_country', S.country); S.q = { ...S.q, min: '', max: '' }; if (S.view === 'listing') S.view = 'browse'; return render(); }
  if (t.id === 'si-country') { S.country = t.value; return; }
  if (t.id === 'f-type') { keepDraft(); return render(); }
  const qmap = { 'q-min': 'min', 'q-max': 'max', 'q-sort': 'sort', 'q-beds': 'beds' };
  if (qmap[t.id]) { S.q[qmap[t.id]] = t.value; return render(); }
  if (t.dataset.upload) act(async () => {
    const file = t.files[0]; if (!file) return;
    const bytes = await file.arrayBuffer();
    if (t.dataset.upload === 'photo') { const r = await api('POST', `/listings/${t.dataset.id}/photos`, undefined, { raw: bytes, contentType: file.type || 'image/jpeg' }); toast(r.duplicate_of.length ? 'Photo added, but it also appears on another listing; the admin will see that.' : 'Photo added.'); }
    else { const kind = $('#doc-kind').value; await api('POST', `/listings/${t.dataset.id}/documents?kind=${kind}`, undefined, { raw: bytes, contentType: file.type || 'application/pdf' }); toast('Document uploaded (encrypted). Admins check it before approval.'); }
    await render();
  });
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault(); const fd = new FormData(f), kind = f.dataset.form, b = Object.fromEntries(fd);
  act(async () => {
    if (kind === 'otp') {
      S.phone = String(b.phone).replace(/\s+/g, ''); S.country = b.country;
      if (!S.otpSent) { const r = await api('POST', '/auth/otp', { phone_e164: S.phone }); S.otpSent = true; S.devCode = r.dev_code || null; toast(r.dev_code ? 'Development mode: code shown on screen.' : 'Code sent by SMS.'); }
      else { const r = await api('POST', '/auth/otp/verify', { phone_e164: S.phone, code: b.code, country: b.country, full_name: b.full_name, role: b.role }); TOKEN = r.token; localStorage.setItem('noble_token', TOKEN); S.me = r.user; S.otpSent = false; S.devCode = null; S.view = 'browse'; toast(`Signed in as ${r.user.full_name}.`); if (!r.user.verified && r.user.role !== 'admin') setTimeout(openVerify, 300); }
    } else if (kind === 'kyc') { const r = await api('POST', '/auth/kyc', { document_type: b.document_type, document_number: b.document_number }); modal(''); if (r.redirect_url) { window.open(r.redirect_url, '_blank'); toast('Finish verification with the provider, then refresh.'); } else toast(r.status === 'verified' ? 'Verified. You can now list, message and pay.' : `Verification ${r.status}.`); await refreshMe(); }
    else if (kind === 'offer') { if (!needAuth()) return; const amt = Math.round(+b.amt * 100); if (!(amt > 0)) throw new Error('Enter an offer amount'); const th = f.dataset.thread ? { id: f.dataset.thread } : await api('POST', '/threads', { listing_id: f.dataset.id }); await api('POST', `/threads/${th.id}/messages`, { kind: 'offer', offer_minor: amt }); S.thread = th.id; S.view = 'messages'; toast('Offer sent.'); }
    else if (kind === 'msg') { const text = String(b.text || '').trim(); if (!text) return; await api('POST', `/threads/${f.dataset.id}/messages`, { kind: 'text', body: text }); }
    else if (kind === 'viewing') { if (!b.when) throw new Error('Pick a date and time'); await api('POST', `/threads/${f.dataset.id}/messages`, { kind: 'viewing', viewing_at: new Date(b.when).toISOString() }); toast('Viewing proposed.'); }
    else if (kind === 'pay') { const r = await api('POST', '/transactions', { listing_id: f.dataset.id, gateway: b.gateway, payer_account: b.payer_account, idempotency_key: crypto.randomUUID() }); modal(''); S.view = 'escrow'; if (r.redirect_url && r.state === 'payment_pending') { window.open(r.redirect_url, '_blank'); toast('Complete the payment with the provider.'); } else toast(r.state === 'held' ? `${money(r.amount_minor, r.currency)} is now held in escrow.` : `Payment ${r.state.replace('_', ' ')}: check your phone for the prompt.`); }
    else if (kind === 'report') { await api('POST', `/listings/${f.dataset.id}/report`, { reason: b.reason, details: b.details }); modal(''); toast('Report sent to the moderation team.'); }
    else if (kind === 'dispute') { await api('POST', `/transactions/${f.dataset.id}/transitions`, { transition: 'open_dispute', reason: b.reason }); modal(''); toast('Refund requested. The seller or an admin will respond.'); }
    else if (kind === 'listing') {
      keepDraft(); const d = S.draft;
      const body = { type: b.type, title: b.title, price_minor: Math.round(+b.price * 100), size: +b.size, size_unit: b.size_unit, bedrooms: +b.bedrooms || 0, title_status: b.title_status, place_name: b.place_name, address_private: b.address_private, description: b.description, client_owner_name: b.client_owner_name };
      if (d.lat != null) { body.lat = d.lat; body.lng = d.lng; } else if (b.address_private) body.address = b.address_private; else throw new Error('Pin the location on the map or enter the address');
      const l = await api('POST', '/listings', body); S.draft = null; S.selected = l.id; S.view = 'listing'; toast('Submitted. Add photos and the ownership document; an admin reviews it before it goes live.');
    }
    await render();
  });
});

(async () => {
  try { S.countries = await api('GET', '/countries'); } catch (e) { $('#app').innerHTML = `<div class="empty">Cannot reach the Noble API at <span class="mono">${esc(API)}</span>.<br><span class="small">Start it with <span class="mono">cd backend && node src/server.js</span>, or open this page with <span class="mono">?api=https://your-api</span>.</span></div>`; return; }
  if (!S.countries.find(c => c.code === S.country)) S.country = S.countries[0].code;
  await refreshMe();
  const h = location.hash.slice(1); if (/^[0-9a-f-]{36}$/.test(h)) { S.selected = h; S.view = 'listing'; }
  await render();
})();
})();
</script>
</body>
</html>
